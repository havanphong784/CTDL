<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Cấu Trúc Dữ Liệu & Giải Thuật</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Bảng điều khiển bên trái: Chọn gói câu hỏi -->
        <aside class="sidebar left-sidebar">
            <div class="sidebar-header">
                <h2>📚 Gói Câu Hỏi</h2>
            </div>
            <div class="pack-list" id="pack-list">
                <!-- Danh sách gói câu hỏi sẽ được render bằng JS -->
            </div>
            <div class="progress-section">
                <h3>Tiến trình hiện tại</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="overall-progress-bar"></div>
                </div>
                <p id="progress-text">0 / 0</p>
            </div>
        </aside>

        <!-- Phần giữa: Hiển thị câu hỏi trắc nghiệm -->
        <main class="main-content">
            <header class="main-header">
                <h1 id="quiz-title">Vui lòng chọn một bộ câu hỏi</h1>
            </header>

            <div class="quiz-container" id="quiz-container" style="display: none;">
                <div class="question-header">
                    <span class="question-counter" id="question-counter">Câu 1/20</span>
                    <span class="score-display" id="score-display">Điểm: 0</span>
                </div>

                <div class="question-card">
                    <h2 class="question-text" id="question-text">Loading question...</h2>
                </div>

                <div class="options-container" id="options-container">
                    <!-- Options will be generated by JS -->
                </div>

                <div class="explanation-card" id="explanation-card" style="display: none;">
                    <div class="explanation-title">💡 Giải thích:</div>
                    <p class="explanation-text" id="explanation-text"></p>
                    <div class="explanation-translation" id="explanation-translated"></div>
                </div>

                <div class="controls-container">
                    <button class="btn btn-secondary" id="btn-prev" disabled>Câu trước</button>
                    <button class="btn btn-primary" id="btn-next">Câu tiếp theo</button>
                </div>
            </div>

            <div class="empty-state" id="empty-state">
                <div class="icon">🚀</div>
                <p>Chọn một bộ câu hỏi từ danh sách bên trái để bắt đầu ôn tập!</p>
            </div>
        </main>

        <!-- Bảng điều khiển bên phải: Từ điển tra cứu -->
        <aside class="sidebar right-sidebar">
            <div class="sidebar-header">
                <h2>📖 Từ Điển CTDL&GT</h2>
            </div>
            <div class="search-container">
                <input type="text" id="dict-search" placeholder="Tìm kiếm từ vựng...">
            </div>
            <div class="dict-list" id="dict-list">
                <!-- Danh sách từ vựng sẽ được render bằng JS -->
            </div>
        </aside>
    </div>

    <script src="./src/js/script.js"></script>
</body>

</html>
